experiment:
  seed: 20260731
  preset: standard            # quick | standard
  repeats_per_condition: 1    # stability pilot may raise this to 3
  warmup_requests: 5
  concurrency: 1
  request_timeout_seconds: 120
  max_retries: 5
  max_total_requests: 560     # 440 main + 40 stability pilot + 5 warmup + headroom
  max_budget_usd: 1.0
  bootstrap_resamples: 10000
  stability_pilot_tasks: 20

request_defaults:
  temperature: 0
  max_output_tokens: 64
  system_prompt: null
  tools: disabled
  web_search: disabled
  response_format: text

models:
  - label: primary
    provider: google
    api_style: gemini_generate_content
    model_id: gemini-2.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GOOGLE_GENERATIVE_AI_API_KEY
    reasoning_mode: disabled
    reasoning_disable_method: generationConfig.thinkingConfig.thinkingBudget=0
    reasoning_evidence_field: usageMetadata.thoughtsTokenCount
    request_overrides: {}
    pricing:
      input_per_million_usd: 0.10
      output_per_million_usd: 0.40
      cached_input_per_million_usd: 0.025
      source: https://ai.google.dev/gemini-api/docs/pricing
      retrieved_utc: '2026-07-31'

  # Reasoning CANNOT be switched off on this generation: the API rejects
  # thinkingBudget with 400 INVALID_ARGUMENT and thinkingLevel has no "off"
  # value (verified 2026-07-31). "minimal" is the floor, so this run is not a
  # strict replication of the paper's non-reasoning setting and is labelled
  # accordingly.
  - label: gen3
    provider: google
    api_style: gemini_generate_content
    model_id: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GOOGLE_GENERATIVE_AI_API_KEY
    reasoning_mode: minimal_not_disableable
    reasoning_disable_method: not available; thinkingLevel floor is "minimal"
    reasoning_evidence_field: usageMetadata.thoughtsTokenCount
    thinking_config:
      thinkingLevel: minimal
    request_overrides: {}
    pricing:
      input_per_million_usd: 0.30
      output_per_million_usd: 2.50
      cached_input_per_million_usd: null
      source: https://ai.google.dev/gemini-api/docs/pricing
      retrieved_utc: '2026-07-31'

  # Same model with thinking actually engaged. At "minimal" the API reported zero
  # thinking tokens, so that run does not test reasoning at all; "high" spends
  # ~670 thinking tokens per request. maxOutputTokens must cover thinking plus the
  # answer, so the 64-token cap of the other profiles cannot be used here.
  - label: gen3high
    provider: google
    api_style: gemini_generate_content
    model_id: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GOOGLE_GENERATIVE_AI_API_KEY
    reasoning_mode: high
    reasoning_disable_method: not applicable; thinking deliberately enabled
    reasoning_evidence_field: usageMetadata.thoughtsTokenCount
    thinking_config:
      thinkingLevel: high
    request_overrides:
      maxOutputTokens: 8192
    pricing:
      input_per_million_usd: 0.30
      output_per_million_usd: 2.50
      cached_input_per_million_usd: null
      source: https://ai.google.dev/gemini-api/docs/pricing
      retrieved_utc: '2026-07-31'

output:
  root_dir: out
  save_redacted_request_payloads: true
  save_raw_responses: true
  make_charts: true
